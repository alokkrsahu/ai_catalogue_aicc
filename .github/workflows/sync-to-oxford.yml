name: Sync to Oxford mirror

# One-way mirror: this repository is the master. Every push to main is force-pushed
# to OxfordCompetencyCenters/intellidoc, which is treated purely as a destination.
#
# Deliberately different from the previous sync-upstream.yml, which broke in Feb 2026:
#   * It ran `git merge upstream/main`, pulling the mirror's history back into ours.
#     That produced 143 bookkeeping commits and is the opposite of "we are the master".
#     This workflow never fetches or merges from the mirror.
#   * It committed `git rm -rf .github/` onto a branch that was then pushed and merged,
#     so every run deleted the workflow that performs the sync. Here the removal happens
#     on a throwaway branch that is never merged back, so main keeps this file.
#
# Requires repository secret OXFORD_PAT: a fine-grained PAT with resource owner
# OxfordCompetencyCenters, repository intellidoc, Contents: read and write, and a
# lifetime of 366 days or less (the Oxford enterprise rejects longer-lived tokens).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-to-oxford
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force-push mirror (workflows excluded)
        env:
          OXFORD_PAT: ${{ secrets.OXFORD_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${OXFORD_PAT:-}" ]; then
            echo "::error::OXFORD_PAT secret is not set — cannot push to the mirror."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Throwaway branch. Never merged back, so main is unaffected.
          git checkout -B oxford-mirror

          # The Oxford org does not accept workflow files, so strip them from what
          # is published. This commit exists only on the throwaway branch.
          if [ -d .github/workflows ]; then
            git rm -rq .github/workflows
            git commit -qm "chore: exclude CI workflows from the Oxford mirror"
            echo "Removed .github/workflows from the mirrored tree."
          fi

          echo "Mirroring $(git rev-list --count HEAD) commits to OxfordCompetencyCenters/intellidoc"

          git push --force \
            "https://x-access-token:${OXFORD_PAT}@github.com/OxfordCompetencyCenters/intellidoc.git" \
            HEAD:main

          echo "Mirror updated."
