<!DOCTYPE html>
<html lang="en-gb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AICC Workflow Chatbot</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Barlow+Semi+Condensed:300,400,400i,500,500i,600,600i,700,700i">
  <style>
    /* Reset and base styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Oxford AICC color scheme and typography */
    :root {
      --oxford-blue: #002147;
      --oxford-dark-blue: #001a33;
      --oxford-light-blue: #4a90a4;
      --oxford-grey: #6b7280;
      --oxford-light-grey: #f3f4f6;
      --oxford-border: #e1e5e9;
      --oxford-white: #ffffff;
      --oxford-accent: #0066cc;
      --oxford-success: #059669;
      --oxford-warning: #d97706;
      --oxford-error: #dc2626;
      --oxford-font: 'Barlow Semi Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      font-family: var(--oxford-font);
      background: #f8f9fa;
      padding: 0;
      margin: 0;
    }

    /* Full-width chatbot container - NO rounded corners */
    .oxford-inline-chatbot {
      font-family: var(--oxford-font);
      /* position: absolute; */
      left: 0;
      right: 0;
      width: 100%;
      margin: 0;
      background: var(--oxford-white);
      border: none;
      border-top: 1px solid var(--oxford-border);
      border-bottom: 1px solid var(--oxford-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* Chat header - Oxford branding with left-aligned text */
    .chat-header {
      background: var(--oxford-blue);
      color: var(--oxford-white);
      padding: 24px 40px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      border-bottom: 1px solid var(--oxford-dark-blue);
    }

    .oxford-branding {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .oxford-crest {
      width: 32px;
      height: 32px;
      background: var(--oxford-white);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--oxford-blue);
    }

    .chat-header h3 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.025em;
      text-align: left;
    }

    .chat-header .status {
      font-size: 14px;
      opacity: 0.9;
      font-weight: 400;
      margin-top: 2px;
      text-align: left;
    }

    /* Messages area - Oxford styling */
    .messages {
      flex: 1;
      padding: 24px 40px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: #fafbfc;
    }

    .message {
      max-width: 85%;
      padding: 14px 18px;
      border-radius: 0;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      font-weight: 400;
    }

    .message.user {
      background: var(--oxford-blue);
      color: var(--oxford-white);
      align-self: flex-end;
      font-weight: 500;
    }

    .message.bot {
      background: var(--oxford-white);
      color: var(--oxford-dark-blue);
      border: 1px solid var(--oxford-border);
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0, 33, 71, 0.05);
    }

    /* Streaming message indicator */
    .message.bot.streaming {
      position: relative;
    }

    .message.bot.streaming::after {
      content: '';
      display: inline-block;
      width: 8px;
      height: 16px;
      background: var(--oxford-blue);
      margin-left: 4px;
      animation: blink 1s infinite;
      vertical-align: baseline;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* Enhanced formatting for bot messages */
    .message.bot p {
      margin: 0 0 10px 0;
    }

    .message.bot p:last-child {
      margin-bottom: 0;
    }

    .message.bot ul, .message.bot ol {
      margin: 10px 0;
      padding-left: 0;
    }

    .message.bot li {
      margin: 6px 0;
      margin-left: 20px;
    }

    .message.bot ul li {
      list-style-type: disc;
    }

    .message.bot ol li {
      list-style-type: decimal;
    }

    .message.bot a {
      color: var(--oxford-blue);
      text-decoration: underline;
      transition: all 0.2s ease;
    }

    .message.bot a:hover {
      color: var(--oxford-dark-blue);
      text-decoration-thickness: 2px;
    }

    .message.bot strong {
      font-weight: 600;
      color: var(--oxford-dark-blue);
    }

    .message.bot em {
      font-style: italic;
      color: var(--oxford-grey);
    }

    .message.bot code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 0;
      font-family: monospace;
      font-size: 0.9em;
    }

    .message.bot pre {
      background: #f3f4f6;
      padding: 12px;
      border-radius: 0;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message.bot pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    .message.bot blockquote {
      border-left: 3px solid var(--oxford-blue);
      padding-left: 12px;
      margin: 8px 0;
      color: var(--oxford-grey);
      font-style: italic;
    }

    .message.bot hr {
      border: none;
      border-top: 1px solid var(--oxford-border);
      margin: 12px 0;
    }

    .message.bot h1, .message.bot h2, .message.bot h3, 
    .message.bot h4, .message.bot h5, .message.bot h6 {
      color: var(--oxford-dark-blue);
      font-weight: 600;
      margin: 12px 0 8px;
    }

    .message.bot h1 { font-size: 1.5em; }
    .message.bot h2 { font-size: 1.3em; }
    .message.bot h3 { font-size: 1.15em; }
    .message.bot h4, .message.bot h5, .message.bot h6 { font-size: 1em; }

    /* Inline citation chips and tooltips */
    .message.bot .cite-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 4px;
      background: var(--oxford-blue);
      color: var(--oxford-white);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      vertical-align: super;
      margin: 0 1px;
      line-height: 1;
      transition: filter 0.15s;
    }
    .message.bot .cite-chip:hover {
      filter: brightness(0.88);
    }
    .message.bot .cite-chip-secondary {
      background: #e5e7eb;
      color: #374151;
      cursor: default;
    }
    .message.bot .cite-chip-secondary:hover {
      filter: none;
    }
    .message.bot .cite-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      border-radius: 4px;
      background: var(--oxford-blue);
      color: var(--oxford-white);
      font-size: 11px;
      font-weight: 600;
      vertical-align: super;
      margin: 0 1px;
      line-height: 1;
      text-decoration: none;
      transition: filter 0.15s;
    }
    .message.bot .cite-link:hover {
      filter: brightness(0.88);
      text-decoration: none;
    }
    .cite-tooltip {
      position: fixed;
      max-width: 340px;
      background: #1e293b;
      color: #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      z-index: 10000;
      animation: citeIn 0.15s ease-out;
    }
    .cite-tooltip-title {
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 6px;
      font-size: 12px;
    }
    .cite-tooltip-link {
      color: #38bdf8;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
      transition: color 0.15s;
    }
    .cite-tooltip-link:hover {
      color: #7dd3fc;
    }
    .cite-tooltip-source {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cite-tooltip-quote {
      font-style: italic;
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
    }
    @keyframes citeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typing indicator - Oxford colors */
    .message.typing {
      background: var(--oxford-white);
      border: 1px solid var(--oxford-border);
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0, 33, 71, 0.05);
      border-radius: 0;
    }

    .typing-dots {
      display: flex;
      gap: 4px;
    }

    .typing-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--oxford-blue);
      animation: oxfordBounce 1.4s infinite;
    }

    .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
    .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes oxfordBounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    /* Thinking indicator */
    .thinking-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .thinking-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--oxford-border);
      border-top: 2px solid var(--oxford-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    .thinking-text {
      color: var(--oxford-grey);
      font-size: 14px;
      font-weight: 500;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Input area - Oxford form styling */
    .input-area {
      padding: 24px 40px;
      border-top: 1px solid var(--oxford-border);
      background: var(--oxford-white);
      display: flex;
      gap: 14px;
      align-items: flex-end;
    }

    .message-input {
      flex: 1;
      border: 2px solid var(--oxford-border);
      border-radius: 0;
      padding: 14px 18px;
      font-size: 15px;
      font-family: var(--oxford-font);
      outline: none;
      transition: all 0.2s ease;
      resize: none;
      min-height: 24px;
      max-height: 120px;
      background: var(--oxford-white);
    }

    .message-input:focus {
      border-color: var(--oxford-blue);
      box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.1);
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 0;
      background: var(--oxford-blue);
      color: var(--oxford-white);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      font-size: 20px;
      font-weight: 600;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--oxford-dark-blue);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 33, 71, 0.2);
    }

    .send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Welcome message - Oxford branding with left alignment */
    .welcome-message {
      background: linear-gradient(135deg, rgba(0, 33, 71, 0.05) 0%, rgba(74, 144, 164, 0.05) 100%);
      border: 2px solid rgba(0, 33, 71, 0.1);
      padding: 24px;
      border-radius: 0;
      margin-bottom: 10px;
    }

    .welcome-message h4 {
      color: var(--oxford-blue);
      margin-bottom: 14px;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .welcome-message p {
      color: var(--oxford-grey);
      font-size: 15px;
      margin-bottom: 14px;
      line-height: 1.6;
      text-align: left;
    }

    .quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-start;
    }

    .quick-question {
      background: var(--oxford-white);
      border: 1px solid var(--oxford-blue);
      color: var(--oxford-blue);
      padding: 10px 16px;
      border-radius: 0;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--oxford-font);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-question:hover {
      background: var(--oxford-blue);
      color: var(--oxford-white);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 33, 71, 0.2);
    }

    /* Status text */
    .status-text {
      font-size: 13px;
      color: var(--oxford-grey);
      padding: 8px 40px;
      background: var(--oxford-white);
      border-top: 1px solid var(--oxford-border);
    }

    /* Status indicators */
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--oxford-success);
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Human Input Modal - Oxford styling */
    .human-input-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 33, 71, 0.6);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .human-input-modal.active {
      display: flex;
    }

    .human-input-box {
      background: var(--oxford-white);
      border-radius: 0;
      padding: 32px;
      max-width: 540px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 33, 71, 0.3);
      border: 2px solid var(--oxford-blue);
    }

    .human-input-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--oxford-blue);
      margin-bottom: 16px;
      font-family: var(--oxford-font);
    }

    .human-input-message {
      background: #fafbfc;
      border: 1px solid var(--oxford-border);
      border-radius: 0;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 15px;
      color: var(--oxford-dark-blue);
      line-height: 1.6;
      font-family: var(--oxford-font);
    }

    .human-input-textarea {
      width: 100%;
      min-height: 100px;
      border: 2px solid var(--oxford-border);
      border-radius: 0;
      padding: 14px;
      font-size: 15px;
      resize: vertical;
      font-family: var(--oxford-font);
      transition: all 0.2s ease;
    }

    .human-input-textarea:focus {
      outline: none;
      border-color: var(--oxford-blue);
      box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.1);
    }

    .human-input-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .human-input-buttons button {
      padding: 12px 24px;
      border-radius: 0;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: var(--oxford-font);
      transition: all 0.2s ease;
    }

    .human-input-buttons .submit-btn {
      background: var(--oxford-blue);
      color: var(--oxford-white);
    }

    .human-input-buttons .submit-btn:hover:not(:disabled) {
      background: var(--oxford-dark-blue);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 33, 71, 0.2);
    }

    .human-input-buttons .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .human-input-buttons .cancel-btn {
      background: var(--oxford-light-grey);
      color: var(--oxford-dark-blue);
      border: 1px solid var(--oxford-border);
    }

    .human-input-buttons .cancel-btn:hover {
      background: var(--oxford-border);
    }

    /* Mobile responsiveness */
    @media (max-width: 768px) {
      .oxford-inline-chatbot {
        height: 500px;
        position: relative;
        left: auto;
        right: auto;
      }

      .chat-header {
        padding: 16px 20px;
      }

      .messages {
        padding: 16px 20px;
        gap: 14px;
      }

      .input-area {
        padding: 16px 20px;
        gap: 12px;
      }

      .message {
        padding: 12px 16px;
        font-size: 14px;
        max-width: 90%;
      }

      .welcome-message {
        padding: 16px;
      }

      .welcome-message h4 {
        font-size: 16px;
      }

      .quick-questions {
        gap: 8px;
        flex-direction: column;
      }

      .quick-question {
        padding: 12px 16px;
        font-size: 14px;
        width: 100%;
        text-align: center;
      }

      .send-btn {
        width: 44px;
        height: 44px;
        font-size: 18px;
      }

      .status-text {
        padding: 8px 20px;
      }

      .human-input-box {
        padding: 24px;
      }
    }

    @media (max-width: 480px) {
      .oxford-inline-chatbot {
        height: 450px;
      }

      .chat-header {
        padding: 14px 16px;
      }

      .oxford-crest {
        width: 28px;
        height: 28px;
        font-size: 12px;
      }

      .chat-header h3 {
        font-size: 16px;
      }

      .chat-header .status {
        font-size: 12px;
      }

      .messages {
        padding: 14px 16px;
      }

      .input-area {
        padding: 14px 16px;
      }

      .message-input {
        font-size: 14px;
        padding: 12px 14px;
      }

      .welcome-message {
        padding: 14px;
      }

      .welcome-message h4 {
        font-size: 15px;
      }

      .welcome-message p {
        font-size: 14px;
      }
    }

    /* Scrollbar styling - Oxford theme */
    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--oxford-border);
      border-radius: 3px;
    }

    .messages::-webkit-scrollbar-thumb:hover {
      background: var(--oxford-grey);
    }

    /* Demo container styling - full width */
    /* Mobile-first: no bleed */
    .demo-container {
      width: 100vw;
      margin: 0;
      padding: 0;
    }

    /* Full-bleed only when wider than the column */
    @media (min-width: calc(842px + 1px)) {
      .demo-container {
        width: 100vw;
        /* pull equally from both sides to align with the column centre */
        margin-left: calc((100vw - 842px) / -2);
        margin-right: calc((100vw - 842px) / -2);
      }
    }
  </style>
</head>
<body>
  <div class="demo-container">
    <div class="oxford-inline-chatbot" id="oxfordInlineChatbot">
      <!-- Header with Oxford branding -->
      <div class="chat-header">
        <div class="oxford-branding">
          <div class="oxford-crest">AI</div>
          <div>
            <h3>AICC Chatbot</h3>
            <div class="status" id="chatStatus">
              <span class="status-indicator"></span>Ready to help
            </div>
          </div>
        </div>
      </div>

      <!-- Messages Area -->
      <div class="messages" id="messages">
        <div class="welcome-message">
          <h4>
            <span>👋</span>
            Welcome to the AI Competency Centre
          </h4>
          <p>I'm here to help you with questions related to AICC services. Ask me anything!</p>
          <div class="quick-questions">
            <button class="quick-question" onclick="sendQuickMessage('What services do you offer?')">Our Services</button>
            <button class="quick-question" onclick="sendQuickMessage('What training programmes are available?')">Training</button>
            <button class="quick-question" onclick="sendQuickMessage('How can I access GenAI tools?')">GenAI Tools</button>
            <button class="quick-question" onclick="sendQuickMessage('What is the AI Competency Centre?')">About AICC</button>
          </div>
        </div>
      </div>

      <!-- Status Text -->
      <div id="status" class="status-text"></div>

      <!-- Input Area -->
      <div class="input-area">
        <textarea 
          class="message-input" 
          id="messageInput" 
          placeholder="Ask a question about your documents..."
          rows="1"
        ></textarea>
        <button class="send-btn" id="sendBtn">
          <span>→</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Human Input Modal -->
  <div id="humanInputModal" class="human-input-modal">
    <div class="human-input-box">
      <div class="human-input-title" id="humanInputTitle">USER INPUT REQUIRED</div>
      <div class="human-input-message" id="humanInputMessage"></div>
      <textarea id="humanInputTextarea" class="human-input-textarea" placeholder="Enter your response..."></textarea>
      <div class="human-input-buttons">
        <button class="cancel-btn" id="humanInputCancel">Cancel</button>
        <button class="submit-btn" id="humanInputSubmit">Submit</button>
      </div>
    </div>
  </div>

  <script>
    const ENDPOINT_URL = 'https://aicc.uksouth.cloudapp.azure.com/api/workflow-deploy/ea6e57a3-7ae8-4601-9abd-62197abc094c/';
    const STREAM_URL = ENDPOINT_URL.replace(/\/$/, '') + '/stream/';
    const SUBMIT_INPUT_URL = ENDPOINT_URL.replace(/\/$/, '') + '/submit-input/';
    const API_ORIGIN = (function () {
      try { return new URL(STREAM_URL).origin; } catch (_e) { return ''; }
    })();
    const PROJECT_ID = (function () {
      var m = ENDPOINT_URL.match(/workflow-deploy\/([0-9a-f-]{36})/i);
      return m ? m[1] : null;
    })();

    var _chatCitations = [];
    var _activeCiteTooltip = null;

    function parseCitations(text) {
      if (!text) return { cleanText: '', citations: [] };
      var pattern = /---CITATIONS---\s*([\s\S]*?)\s*---END_CITATIONS---/;
      var m = text.match(pattern);
      if (!m) {
        var start = text.indexOf('---CITATIONS---');
        if (start !== -1) {
          return { cleanText: text.slice(0, start).trim(), citations: [] };
        }
        return { cleanText: text, citations: [] };
      }
      var cleanText = text.slice(0, m.index).trim();
      cleanText = cleanText.replace(/[\n\r]+(?:#{1,6}\s*)?(?:\*{1,2})?CITATIONS(?:\*{1,2})?\s*$/i, '').trim();
      var citations = [];
      try {
        citations = JSON.parse(m[1].trim());
        if (!Array.isArray(citations)) citations = [];
        else {
          citations = citations.filter(function (c) {
            if (!c || typeof c !== 'object') return false;
            var r = parseInt(c.ref, 10);
            if (isNaN(r)) return false;
            c.ref = r;
            return true;
          });
        }
      } catch (_e) {
        citations = [];
      }
      return { cleanText: cleanText, citations: citations };
    }

    function renderCitationChips(html, citations) {
      if (!citations || citations.length === 0) return html;
      return html.replace(/\[(\d+)\]/g, function (match, num) {
        var ref = parseInt(num, 10);
        var cit = citations.find(function (c) { return Number(c.ref) === ref; });
        if (!cit) return '<span class="cite-chip cite-chip-secondary" data-ref="' + ref + '">' + ref + '</span>';
        // Web citation with a URL → direct hyperlink
        if (cit.url) {
          var safeUrl = cit.url.replace(/"/g, '&quot;').replace(/</g, '&lt;');
          var titleAttr = (cit.document_title || cit.url).replace(/"/g, '&quot;').replace(/</g, '&lt;');
          return '<a class="cite-link" href="' + safeUrl + '" target="_blank" rel="noopener" title="' + titleAttr + '">' + ref + '</a>';
        }
        // Document citation (no public URL) → keep chip+tooltip for authenticated download
        return '<span class="cite-chip" data-ref="' + ref + '">' + ref + '</span>';
      });
    }

    function _getCiteAuthHeaders() {
      try {
        var raw = localStorage.getItem('auth');
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.token) return { Authorization: 'Bearer ' + parsed.token };
        }
      } catch (_e) {}
      return {};
    }

    function openCitationDocument(documentId) {
      if (!PROJECT_ID || !documentId || !API_ORIGIN) return;
      var url = API_ORIGIN + '/api/projects/' + PROJECT_ID + '/documents/' + documentId + '/download/';
      fetch(url, { headers: _getCiteAuthHeaders() })
        .then(function (resp) {
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          return resp.blob();
        })
        .then(function (blob) {
          var blobUrl = URL.createObjectURL(blob);
          window.open(blobUrl, '_blank');
          setTimeout(function () { URL.revokeObjectURL(blobUrl); }, 60000);
        })
        .catch(function (err) {
          console.error('Citation document open failed:', err);
        });
    }

    function showCiteTooltip(chipEl, ref) {
      if (_activeCiteTooltip) {
        _activeCiteTooltip.remove();
        _activeCiteTooltip = null;
      }
      var cit = _chatCitations.find(function (c) { return Number(c.ref) === ref; });
      if (!cit) return;
      var tip = document.createElement('div');
      tip.className = 'cite-tooltip';
      var isWeb = cit.url || cit.source === 'web';
      var titleHtml;
      if (cit.document_id) {
        var loc = '';
        if (cit.page) loc += 'p.' + cit.page;
        if (cit.section) loc += (loc ? ', ' : '') + cit.section;
        var titleText = (cit.document_title || 'Document') + (loc ? ' — ' + loc : '');
        titleHtml = '<a class="cite-tooltip-link" href="#" data-docid="' + cit.document_id + '">' + titleText.replace(/</g, '&lt;') + '</a>';
      } else if (isWeb && cit.url) {
        var safeUrl = cit.url.replace(/"/g, '&quot;').replace(/</g, '&lt;');
        titleHtml = '<a class="cite-tooltip-link" href="' + safeUrl + '" target="_blank" rel="noopener">' + (cit.document_title || cit.url).replace(/</g, '&lt;') + '</a>';
      } else {
        titleHtml = (cit.document_title || 'Source').replace(/</g, '&lt;');
      }
      var sourceHtml = '';
      if (isWeb && cit.url) {
        try {
          var domain = new URL(cit.url).hostname.replace(/^www\./, '');
          sourceHtml = '<div class="cite-tooltip-source">&#127760; ' + domain.replace(/</g, '&lt;') + '</div>';
        } catch (_e) {
          sourceHtml = '<div class="cite-tooltip-source">&#127760; Web</div>';
        }
      }
      tip.innerHTML =
        '<div class="cite-tooltip-title">' + titleHtml + '</div>' +
        sourceHtml +
        '<div class="cite-tooltip-quote">&ldquo;' +
        (cit.quoted_text || '').slice(0, 300).replace(/</g, '&lt;') +
        '&rdquo;</div>';
      var rect = chipEl.getBoundingClientRect();
      tip.style.left = rect.left + 'px';
      tip.style.top = rect.bottom + 6 + 'px';
      document.body.appendChild(tip);
      _activeCiteTooltip = tip;
    }

    document.addEventListener('click', function (e) {
      var link = e.target.closest && e.target.closest('.cite-tooltip-link');
      if (link) {
        if (link.dataset.docid) {
          e.preventDefault();
          e.stopPropagation();
          openCitationDocument(link.dataset.docid);
          return;
        }
        if (link.href && link.target === '_blank') {
          return;
        }
      }
      var chip = e.target.closest && e.target.closest('.cite-chip');
      if (chip) {
        var ref = parseInt(chip.dataset.ref, 10);
        if (_activeCiteTooltip && _activeCiteTooltip._ref === ref) {
          _activeCiteTooltip.remove();
          _activeCiteTooltip = null;
        } else {
          showCiteTooltip(chip, ref);
          if (_activeCiteTooltip) _activeCiteTooltip._ref = ref;
        }
      } else if (_activeCiteTooltip) {
        _activeCiteTooltip.remove();
        _activeCiteTooltip = null;
      }
    });

    function renderBotHtml(rawText) {
      var parsed = parseCitations(rawText);
      _chatCitations = parsed.citations || [];
      var html = renderMarkdown(parsed.cleanText);
      return renderCitationChips(html, parsed.citations);
    }

    // Enhanced markdown renderer
    function renderMarkdown(text) {
      if (!text) return '';
      
      let html = text;
      
      // Process markdown links BEFORE HTML escaping - convert to special tokens
      // Use a unique token that won't appear in normal text
      html = html.replace(/\[([^\]]+)\]\(([^\)]+)\)/g, function(match, linkText, url) {
        // Encode the URL and text to preserve them through HTML escaping
        const encodedUrl = encodeURIComponent(url);
        const encodedText = encodeURIComponent(linkText);
        return '\x00MDLINK:' + encodedUrl + ':' + encodedText + '\x00';
      });
      
      // Process plain URLs BEFORE HTML escaping
      // Match URLs that are not already converted to MDLINK tokens
      html = html.replace(/(^|[\s\n])(https?:\/\/[^\s<>\[\]"'\x00]+)/g, function(match, prefix, url) {
        // Clean up any trailing punctuation that's likely not part of the URL
        let cleanUrl = url;
        let suffix = '';
        const trailingPunct = cleanUrl.match(/[.,;:!?)]+$/);
        if (trailingPunct) {
          suffix = trailingPunct[0];
          cleanUrl = cleanUrl.slice(0, -suffix.length);
        }
        const encodedUrl = encodeURIComponent(cleanUrl);
        return prefix + '\x00RAWLINK:' + encodedUrl + '\x00' + suffix;
      });
      
      // Now escape HTML entities for the rest of the content
      html = html
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
      
      // Headers
      html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
      
      // Horizontal rules
      html = html.replace(/^\s*[-*]{3,}\s*$/gm, '<hr>');
      
      // Code blocks
      html = html.replace(/```(\w+)?[\n\r]+([\s\S]*?)```/g, function(match, lang, code) {
        const langClass = lang ? ' class="language-' + lang + '"' : '';
        return '<pre><code' + langClass + '>' + code.trim() + '</code></pre>';
      });
      
      // Blockquotes
      html = html.replace(/^&gt;\s+(.+)$/gm, '<blockquote>$1</blockquote>');
      
      // Process lists
      const lines = html.split('\n');
      const processedLines = [];
      let inOrderedList = false;
      let inUnorderedList = false;
      
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const orderedMatch = line.match(/^(\d+)\.\s+(.+)$/);
        const unorderedMatch = line.match(/^[-*]\s+(.+)$/);
        
        if (orderedMatch) {
          if (!inOrderedList) {
            if (inUnorderedList) { processedLines.push('</ul>'); inUnorderedList = false; }
            processedLines.push('<ol>');
            inOrderedList = true;
          }
          processedLines.push('<li>' + orderedMatch[2] + '</li>');
        } else if (unorderedMatch) {
          if (!inUnorderedList) {
            if (inOrderedList) { processedLines.push('</ol>'); inOrderedList = false; }
            processedLines.push('<ul>');
            inUnorderedList = true;
          }
          processedLines.push('<li>' + unorderedMatch[1] + '</li>');
        } else {
          if (inOrderedList) { processedLines.push('</ol>'); inOrderedList = false; }
          if (inUnorderedList) { processedLines.push('</ul>'); inUnorderedList = false; }
          processedLines.push(line);
        }
      }
      if (inOrderedList) processedLines.push('</ol>');
      if (inUnorderedList) processedLines.push('</ul>');
      html = processedLines.join('\n');
      
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/__(?!_)([^_]+)__/g, '<strong>$1</strong>');
      
      // Italic
      html = html.replace(/\*(?!\*)([^*]+)\*(?!\*)/g, '<em>$1</em>');
      html = html.replace(/_(?!_)([^_]+)_(?!_)/g, '<em>$1</em>');
      
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      
      // Paragraphs
      const paragraphs = html.split(/\n\n+/);
      html = paragraphs.map(function(p) {
        p = p.trim();
        if (!p) return '';
        if (/^<(pre|blockquote|ul|ol|hr|h[1-6])/i.test(p)) {
          return p;
        }
        p = p.replace(/\n/g, '<br>');
        return '<p>' + p + '</p>';
      }).filter(function(p) { return p; }).join('');
      
      // Restore markdown links from tokens
      html = html.replace(/\x00MDLINK:([^:]+):([^\x00]+)\x00/g, function(match, encodedUrl, encodedText) {
        const url = decodeURIComponent(encodedUrl);
        const linkText = decodeURIComponent(encodedText);
        // Escape the link text for HTML display
        const safeText = linkText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return '<a href="' + url + '" target="_blank" rel="noopener">' + safeText + '</a>';
      });
      
      // Restore raw links from tokens
      html = html.replace(/\x00RAWLINK:([^\x00]+)\x00/g, function(match, encodedUrl) {
        const url = decodeURIComponent(encodedUrl);
        return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
      });
      
      return html;
    }

    const conversationMessages = [];
    const sessionId = 'sess_' + Math.random().toString(36).slice(2);
    let currentExecutionId = null;
    let awaitingHumanInput = false;
    let isStreaming = false;

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusEl = document.getElementById('status');
    const chatStatus = document.getElementById('chatStatus');
    const humanInputModal = document.getElementById('humanInputModal');
    const humanInputTitle = document.getElementById('humanInputTitle');
    const humanInputMessage = document.getElementById('humanInputMessage');
    const humanInputTextarea = document.getElementById('humanInputTextarea');
    const humanInputSubmit = document.getElementById('humanInputSubmit');
    const humanInputCancel = document.getElementById('humanInputCancel');

    function updateStatus(text) {
      const indicator = chatStatus.querySelector('.status-indicator');
      chatStatus.innerHTML = '';
      if (indicator) chatStatus.appendChild(indicator.cloneNode(true));
      chatStatus.innerHTML += text;
    }

    function appendMessage(role, text, isStreamingMsg = false) {
      const msg = document.createElement('div');
      msg.className = 'message ' + (role === 'user' ? 'user' : 'bot');
      if (isStreamingMsg) {
        msg.classList.add('streaming');
      }
      if (role === 'bot' && !isStreamingMsg) {
        msg.innerHTML = renderBotHtml(text);
      } else {
        msg.textContent = text;
      }
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    function showThinkingIndicator() {
      const msg = document.createElement('div');
      msg.className = 'message bot typing';
      msg.id = 'thinking-indicator';
      msg.innerHTML = `
        <div class="thinking-indicator">
          <div class="thinking-spinner"></div>
          <span class="thinking-text">Thinking...</span>
        </div>
      `;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideThinkingIndicator() {
      const indicator = document.getElementById('thinking-indicator');
      if (indicator) {
        indicator.remove();
      }
    }

    function showHumanInputModal(title, message) {
      humanInputTitle.textContent = title || 'USER INPUT REQUIRED';
      humanInputMessage.textContent = message || 'Please provide your input to continue.';
      humanInputTextarea.value = '';
      humanInputModal.classList.add('active');
      humanInputTextarea.focus();
      awaitingHumanInput = true;
      inputEl.disabled = true;
      sendBtn.disabled = true;
      updateStatus('Waiting for your input...');
    }

    function hideHumanInputModal() {
      humanInputModal.classList.remove('active');
      awaitingHumanInput = false;
      inputEl.disabled = false;
      sendBtn.disabled = false;
      updateStatus('Ready to help');
    }

    async function submitHumanInput() {
      const userInput = humanInputTextarea.value.trim();
      if (!userInput) {
        alert('Please enter your response');
        return;
      }

      humanInputSubmit.disabled = true;
      statusEl.textContent = 'Submitting your response...';

      try {
        const resp = await fetch(SUBMIT_INPUT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            user_input: userInput
          })
        });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || 'HTTP ' + resp.status);
        }

        const data = await resp.json();
        
        appendMessage('user', userInput);
        conversationMessages.push({ role: 'user', content: userInput });
        
        hideHumanInputModal();

        if (data.status === 'awaiting_human_input') {
          if (data.last_conversation_message) {
            appendMessage('bot', data.last_conversation_message);
            conversationMessages.push({ role: 'assistant', content: data.last_conversation_message });
          }
          showHumanInputModal(data.title, data.last_conversation_message);
          currentExecutionId = data.execution_id;
        } else if (data.status === 'success') {
          const reply = data.response || '(No response)';
          appendMessage('bot', reply);
          conversationMessages.push({ role: 'assistant', content: reply });
          statusEl.textContent = '';
          currentExecutionId = null;
        } else if (data.status === 'processing') {
          statusEl.textContent = 'Workflow is processing...';
          setTimeout(() => {
            statusEl.textContent = '';
          }, 2000);
        } else {
          appendMessage('bot', 'Error: ' + (data.error || 'Unexpected error'));
          statusEl.textContent = 'Error from workflow endpoint';
        }
      } catch (e) {
        console.error('Submit input error:', e);
        appendMessage('bot', 'Sorry, there was a problem submitting your input.');
        statusEl.textContent = e.message || 'Network error';
      } finally {
        humanInputSubmit.disabled = false;
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      if (awaitingHumanInput) {
        alert('Please respond to the human input request first');
        return;
      }

      appendMessage('user', text);
      conversationMessages.push({ role: 'user', content: text });

      inputEl.value = '';
      sendBtn.disabled = true;
      isStreaming = true;
      statusEl.textContent = '';
      updateStatus('Processing...');
      showThinkingIndicator();

      try {
        const resp = await fetch(STREAM_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_query: text,
            session_id: sessionId
          })
        });

        if (!resp.ok) {
          const err = await resp.text().catch(() => '');
          throw new Error(err || 'HTTP ' + resp.status);
        }

        let msg = null;
        let accumulatedContent = '';
        let thinkingIndicatorHidden = false;
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value, { stream: true });
          const lines = chunk.split('\n');
          
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              try {
                const data = JSON.parse(line.slice(6));
                if (data.type === 'content') {
                  if (!thinkingIndicatorHidden) {
                    hideThinkingIndicator();
                    thinkingIndicatorHidden = true;
                    msg = document.createElement('div');
                    msg.className = 'message bot streaming';
                    messagesEl.appendChild(msg);
                  }
                  accumulatedContent += data.content;
                  msg.innerHTML = renderBotHtml(accumulatedContent);
                  messagesEl.scrollTop = messagesEl.scrollHeight;
                } else if (data.type === 'awaiting_human_input') {
                  hideThinkingIndicator();
                  showHumanInputModal(data.title, data.last_conversation_message);
                  currentExecutionId = data.execution_id;
                  if (msg) msg.remove();
                  return;
                } else if (data.type === 'error') {
                  hideThinkingIndicator();
                  if (msg) msg.remove();
                  appendMessage('bot', 'Error: ' + (data.error || 'Unexpected error'));
                  statusEl.textContent = 'Error from workflow endpoint';
                  return;
                } else if (data.type === 'citations') {
                  if (Array.isArray(data.citations) && data.citations.length > 0) {
                    _chatCitations = data.citations;
                    if (msg) {
                      const parsed = parseCitations(accumulatedContent);
                      msg.innerHTML = renderCitationChips(renderMarkdown(parsed.cleanText), data.citations);
                      messagesEl.scrollTop = messagesEl.scrollHeight;
                    }
                  }
                } else if (data.type === 'done') {
                  if (msg) {
                    msg.classList.remove('streaming');
                    const _parsed = parseCitations(accumulatedContent);
                    const _clean = _parsed.cleanText;
                    let _cits = [];
                    if (Array.isArray(data.citations) && data.citations.length > 0) {
                      _cits = data.citations;
                    } else if (_chatCitations.length > 0) {
                      _cits = _chatCitations;
                    } else {
                      _cits = _parsed.citations;
                    }
                    _chatCitations = _cits;
                    msg.innerHTML = _cits.length > 0
                      ? renderCitationChips(renderMarkdown(_clean), _cits)
                      : renderMarkdown(_clean);
                  }
                  conversationMessages.push({ role: 'assistant', content: accumulatedContent });
                  statusEl.textContent = '';
                  updateStatus('Ready to help');
                  return;
                }
              } catch (e) {
                console.error('Error parsing SSE data:', e);
              }
            }
          }
        }
        
        // Finalize if we exit the loop normally
        if (msg) {
          msg.classList.remove('streaming');
          const _parsed = parseCitations(accumulatedContent);
          const _clean = _parsed.cleanText;
          const _cits = _chatCitations.length > 0 ? _chatCitations : _parsed.citations;
          _chatCitations = _cits;
          msg.innerHTML = _cits.length > 0
            ? renderCitationChips(renderMarkdown(_clean), _cits)
            : renderMarkdown(_clean);
        }
        updateStatus('Ready to help');
        
      } catch (e) {
        console.error('Chat error:', e);
        hideThinkingIndicator();
        appendMessage('bot', 'Sorry, there was a problem talking to the workflow.');
        statusEl.textContent = e.message || 'Network error';
        updateStatus('Connection error');
      } finally {
        isStreaming = false;
        if (!awaitingHumanInput) {
          sendBtn.disabled = false;
        }
      }
    }

    // Quick message function
    function sendQuickMessage(message) {
      if (!isStreaming && !awaitingHumanInput) {
        inputEl.value = message;
        sendMessage();
      }
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !awaitingHumanInput) {
        e.preventDefault();
        sendMessage();
      }
    });

    humanInputSubmit.addEventListener('click', submitHumanInput);
    humanInputCancel.addEventListener('click', () => {
      hideHumanInputModal();
      statusEl.textContent = 'Input cancelled';
    });
    humanInputTextarea.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.ctrlKey) {
        e.preventDefault();
        submitHumanInput();
      }
    });

    // Auto-focus input after a short delay WITHOUT scrolling
    setTimeout(() => {
      const scrollX = window.scrollX;
      const scrollY = window.scrollY;
      inputEl.focus({ preventScroll: true });
      window.scrollTo(scrollX, scrollY);
    }, 500);

    // Make sendQuickMessage available globally
    window.sendQuickMessage = sendQuickMessage;

    console.log('Oxford AICC Workflow Chatbot initialized');
  </script>
</body>
</html>
